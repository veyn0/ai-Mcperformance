sampling:
  # Aktiviert die Aufnahme der Messwerte.
  enabled: true
  # Wie oft die Messwerte aufgenommen werden (je kleiner, desto reaktiver).
  interval-seconds: 1
  # Maximales Zeitfenster (in Sekunden), das für gleitende Mittelwerte genutzt wird.
  max-window-seconds: 300
  # Langfristige Speicherung der Daten (24 bis 72 Stunden empfohlen).
  long-window-seconds: 172800

storage:
  # Aktiviert die Persistenz von Samples.
  enabled: true
  # Typ der Persistenz: csv oder none.
  type: "csv"
  # Pfad relativ zum Plugin-Ordner oder absolut.
  path: "samples/metrics.csv"
  # Wie oft Samples in den Storage geschrieben werden.
  flush-interval-seconds: 30
  # Beim Start bestehende Samples laden.
  restore-on-start: true

bossbar:
  # Aktiviert die BossBar-Anzeige.
  enabled: true
  # Format der BossBar-Anzeige. {metric} = Name der Metrik, {values} = aktuelle Werte.
  title-format: "<aqua>{metric}</aqua> <gray>»</gray> <white>{values}</white>"
  # Nutze Rollup-Statistiken (Median/P95) statt Mittelwerten in der BossBar.
  use-rollup-stats: false

status-overview:
  # Aktiviert die Statusübersicht, die regelmäßig broadcastet wird.
  enabled: false
  # Intervall in Minuten für den Broadcast.
  interval-minutes: 5
  # Zeitfenster (in Sekunden) für Durchschnittswerte.
  sample-window-seconds: 60
  broadcast:
    # In den Chat der Spieler senden.
    chat: true
    # In die Konsole senden.
    console: true
  # Nachrichtenzeilen, die per Placeholder/MiniMessage formatiert werden.
  lines:
    - "<gold>Performance-Status</gold> <gray>({window_seconds}s)</gray>"
    - "<yellow>MSPT</yellow>: <white>{mspt}</white> <gray>|</gray> <yellow>TPS</yellow>: <white>{tps}</white>"
    - "<yellow>Entities</yellow>: <white>{entities}</white> <gray>|</gray> <yellow>Chunks</yellow>: <white>{chunks}</white>"
    - "<yellow>RAM</yellow>: <white>{ram_mb} MB</white> <gray>|</gray> <yellow>CPU</yellow>: <white>{cpu_percent}%</white>"
    - "<yellow>Spieler</yellow>: <white>{players}</white> <gray>|</gray> <yellow>Sichtweite</yellow>: <white>{view_distance}</white>"

report:
  # Aktiviert das Erstellen von Reports.
  enabled: true
  # Zeitfenster (in Sekunden) für den Report.
  window-seconds: 300
  # MSPT-Schwelle für Spike-Zählung.
  spike-mspt: 50.0
  # Mindestkorrelation für Hinweis (0-1).
  correlation-threshold: 0.5
  # Länge des Peak-Fensters für die Top-N Auswertung.
  peak-window-seconds: 30
  # Anzahl der Top-Peak-Fenster im Report.
  peak-window-count: 3

pterodactyl:
  # Aktiviert das Auslesen der CPU-Auslastung via Pterodactyl (benötigt Pterodactyl4J).
  enabled: false
  # Priorität der CPU-Quelle: pterodactyl-first oder local-only.
  cpu-priority: "pterodactyl-first"
  # URL des Panels, z. B. https://panel.example.com
  panel-url: "https://panel.example.com"
  # API-Key mit Leserechten für den Server.
  api-key: "ptla_your_api_key"
  # Server-Identifier (UUID oder kurzer Identifier) aus dem Panel.
  server-identifier: "server-uuid-or-short-id"
  # Aktualisierungsintervall für Pterodactyl-Daten.
  refresh-seconds: 15

view-distance:
  # Dynamische Sichtweite basierend auf MSPT aktivieren.
  enabled: true
  # Untere Grenze der Sichtweite.
  min: 4
  # Obere Grenze der Sichtweite.
  max: 12
  # Ziel-MSPT für die Regelung.
  target-mspt: 40.0
  # EWMA-Glättung (0-1). Höher = reagiert schneller.
  ewma-alpha: 0.3
  # Maximale Veränderung der Sichtweite pro Minute (in View-Distance-Schritten).
  max-adjust-per-minute: 6
  # Erhöhung erst nach stabiler Unterschreitung des Zielwerts (Sekunden).
  increase-stable-seconds: 30
  # Zeitfenster (in Sekunden) zur Berechnung des MSPT-Durchschnitts.
  sample-window-seconds: 60
  # Prüfintervall (in Sekunden) für die Anpassung.
  check-interval-seconds: 15
  # Abklingzeit (in Sekunden) nach einer Anpassung.
  cooldown-seconds: 60

actions:
  # Aktiviert automatische Performance-Aktionen.
  enabled: true
  # Prüfintervall (in Sekunden) für das Regelwerk.
  check-interval-seconds: 15
  # Zeitfenster (in Sekunden) für die Berechnung der Schwellenwerte.
  sample-window-seconds: 30

  thresholds:
    # Schwellenwerte, ab denen Aktionen aktiviert werden.
    mspt: 45.0
    cpu: 85.0
    entities: 2500

  recovery:
    # Werte, unter denen Aktionen wieder zurückgesetzt werden.
    mspt: 38.0
    cpu: 70.0
    entities: 2000

  simulation-distance:
    # Priorität (höher = wichtiger).
    priority: 30
    # Abklingzeit zwischen erneuten Änderungen.
    cooldown-seconds: 120
    # Zielwert für die Simulationsdistanz während einer Aktion.
    target: 5
    min: 4
    max: 10

  entity-activation-range:
    # Priorität (höher = wichtiger).
    priority: 20
    # Abklingzeit zwischen erneuten Änderungen.
    cooldown-seconds: 180
    # Zielwert für die Entity-Activation-Range.
    target: 16

  mob-caps:
    # Priorität (höher = wichtiger).
    priority: 10
    # Abklingzeit zwischen erneuten Änderungen.
    cooldown-seconds: 180
    # Zielwerte pro Spawn-Kategorie.
    limits:
      monster: 35
      animal: 10
      ambient: 5
      water-animal: 5

test-mode:
  # Aktiviert den Belastungstest-Modus.
  enabled: false
  # Gesamtdauer des Tests in Minuten.
  duration-minutes: 20
  # Schritt-Intervall in Minuten (nach jedem Intervall wird der Wert erhöht).
  step-interval-minutes: 2
  # Zu testende Aktion: view-distance, simulation-distance, mob-caps
  action: "view-distance"
  value:
    # Startwert für View-/Simulation-Distance.
    start: 4
    # Schrittweite pro Intervall.
    step: 1
    # Maximaler Wert (0 = kein Limit).
    max: 12
  mob-caps:
    # Start-Offset für Mob-Caps (wird zu den Basis-Limits addiert).
    start: 0
    # Schrittweite pro Intervall.
    step: 2
    # Maximaler Offset (0 = kein Limit).
    max: 0
    # Basis-Limits (werden pro Kategorie als Ausgangspunkt genutzt).
    base-limits:
      monster: 35
      animal: 10
      ambient: 5
      water-animal: 5
    # Optionale Max-Limits pro Kategorie.
    max-limits:
      monster: 70
      animal: 20
      ambient: 10
      water-animal: 10
  output:
    # Zusammenfassung pro Step.
    summary-path: "tests/load-test-summary.csv"
    # Optional: Rohdaten aller Samples während des Tests.
    sample-path: "tests/load-test-samples.csv"
    write-raw-samples: true
  player-distribution:
    # Spieler während des Tests verteilen (Teleport).
    enabled: false
    # spread = großflächig, cluster = nahe Spawn.
    mode: "spread"
    # Radius für "spread".
    spread-radius: 2000
    # Radius für "cluster".
    cluster-radius: 64
    # Optional: Weltname für Verteilung.
    world: ""

messages:
  reload: "<green>AI-McPerformance-Konfiguration neu geladen.</green>"
  only-player: "<red>Dieser Befehl kann nur im Spiel genutzt werden.</red>"
  usage:
    monitor: "<gray>Verwendung:</gray> <white>/performance monitor &lt;mspt|tps|entities|ram|cpu|chunks|viewdistance&gt; &lt;on|off|toggle&gt;</white>"
    feature: "<gray>Oder:</gray> <white>/performance feature &lt;sampling|storage|bossbar|report|pterodactyl|viewdistance|actions&gt; &lt;on|off|toggle&gt;</white>"
    test: "<gray>Oder:</gray> <white>/performance test &lt;start|stop|status&gt; [view-distance|simulation-distance|mob-caps]</white>"
    reload: "<gray>Oder:</gray> <white>/performance reload</white>"
  bossbar:
    disabled: "<red>BossBar-Monitoring ist derzeit deaktiviert.</red>"
    unknown-metric: "<red>Unbekanntes Metric:</red> <white>{metric}</white>"
    toggle: "<green>BossBar für</green> <yellow>{metric}</yellow> <green>{state}</green>."
  feature:
    unknown: "<red>Unbekanntes Feature:</red> <white>{feature}</white>"
    toggle: "<green>Feature</green> <yellow>{feature}</yellow> <green>{state}</green>."
  test:
    disabled: "<red>Belastungstest-Modus ist deaktiviert.</red>"
    started: "<green>Belastungstest gestartet.</green>"
    stopped: "<green>Belastungstest beendet.</green>"
    already-running: "<yellow>Belastungstest läuft bereits.</yellow>"
    not-running: "<yellow>Es läuft aktuell kein Belastungstest.</yellow>"
    invalid-action: "<red>Unbekannte Test-Aktion:</red> <white>{action}</white>"
    status: "<gray>Belastungstest:</gray> Aktion <white>{action}</white>, Step <white>{step}/{total_steps}</white>, Wert <white>{value}</white>, Start <white>{started}</white>, Ende <white>{ends}</white>"
  report:
    disabled: "<red>Performance-Reports sind derzeit deaktiviert.</red>"
    empty: "<red>Keine Daten für den Report verfügbar.</red>"
    header: "<gold>Performance-Report</gold> <gray>({window}s)</gray>:"
    mspt: "<yellow>MSPT</yellow> Ø <white>{mspt_avg}ms</white>, P95 <white>{mspt_p95}ms</white>, Spikes <white>{spike_count}</white>"
    correlation: "<yellow>Korrelation MSPT:</yellow> Entities r=<white>{corr_entities}</white>, Chunks r=<white>{corr_chunks}</white>, Spieler r=<white>{corr_players}</white>"
    bottlenecks:
      none: "<green>Engpässe:</green> keine auffälligen Indikatoren."
      header: "<gold>Engpässe:</gold>"
      item: "<gray>-</gray> <white>{bottleneck}</white>"
    peaks:
      header: "<gold>Top-{count} Peak-Windows</gold> <gray>({window}s)</gray>:"
      item: "<gray>{index})</gray> <white>{start} - {end}</white>: P95 <white>{mspt_p95}ms</white>, Ø <white>{mspt_avg}ms</white>, Ø Entities <white>{entities}</white>, Ø Chunks <white>{chunks}</white>, Ø Spieler <white>{players}</white>"
