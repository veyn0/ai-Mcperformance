sampling:
  # Wie oft die Messwerte aufgenommen werden (je kleiner, desto reaktiver).
  interval-seconds: 1
  # Maximales Zeitfenster (in Sekunden), das für gleitende Mittelwerte genutzt wird.
  max-window-seconds: 300
  # Langfristige Speicherung der Daten (24 bis 72 Stunden empfohlen).
  long-window-seconds: 172800

storage:
  # Typ der Persistenz: csv oder none.
  type: "csv"
  # Pfad relativ zum Plugin-Ordner oder absolut.
  path: "samples/metrics.csv"
  # Wie oft Samples in den Storage geschrieben werden.
  flush-interval-seconds: 30
  # Beim Start bestehende Samples laden.
  restore-on-start: true

bossbar:
  # Format der BossBar-Anzeige. {metric} = Name der Metrik, {values} = aktuelle Werte.
  title-format: "{metric}: {values}"
  # Nutze Rollup-Statistiken (Median/P95) statt Mittelwerten in der BossBar.
  use-rollup-stats: false

report:
  # Zeitfenster (in Sekunden) für den Report.
  window-seconds: 300
  # MSPT-Schwelle für Spike-Zählung.
  spike-mspt: 50.0
  # Mindestkorrelation für Hinweis (0-1).
  correlation-threshold: 0.5
  # Länge des Peak-Fensters für die Top-N Auswertung.
  peak-window-seconds: 30
  # Anzahl der Top-Peak-Fenster im Report.
  peak-window-count: 3

pterodactyl:
  # Aktiviert das Auslesen der CPU-Auslastung via Pterodactyl (benötigt Pterodactyl4J).
  enabled: false
  # Priorität der CPU-Quelle: pterodactyl-first oder local-only.
  cpu-priority: "pterodactyl-first"
  # URL des Panels, z. B. https://panel.example.com
  panel-url: "https://panel.example.com"
  # API-Key mit Leserechten für den Server.
  api-key: "ptla_your_api_key"
  # Server-Identifier (UUID oder kurzer Identifier) aus dem Panel.
  server-identifier: "server-uuid-or-short-id"
  # Aktualisierungsintervall für Pterodactyl-Daten.
  refresh-seconds: 15

view-distance:
  # Dynamische Sichtweite basierend auf MSPT aktivieren.
  enabled: true
  # Untere Grenze der Sichtweite.
  min: 4
  # Obere Grenze der Sichtweite.
  max: 12
  # Ziel-MSPT für die Regelung.
  target-mspt: 40.0
  # EWMA-Glättung (0-1). Höher = reagiert schneller.
  ewma-alpha: 0.3
  # Maximale Veränderung der Sichtweite pro Minute (in View-Distance-Schritten).
  max-adjust-per-minute: 6
  # Erhöhung erst nach stabiler Unterschreitung des Zielwerts (Sekunden).
  increase-stable-seconds: 30
  # Zeitfenster (in Sekunden) zur Berechnung des MSPT-Durchschnitts.
  sample-window-seconds: 60
  # Prüfintervall (in Sekunden) für die Anpassung.
  check-interval-seconds: 15
  # Abklingzeit (in Sekunden) nach einer Anpassung.
  cooldown-seconds: 60

actions:
  # Aktiviert automatische Performance-Aktionen.
  enabled: true
  # Prüfintervall (in Sekunden) für das Regelwerk.
  check-interval-seconds: 15
  # Zeitfenster (in Sekunden) für die Berechnung der Schwellenwerte.
  sample-window-seconds: 30

  thresholds:
    # Schwellenwerte, ab denen Aktionen aktiviert werden.
    mspt: 45.0
    cpu: 85.0
    entities: 2500

  recovery:
    # Werte, unter denen Aktionen wieder zurückgesetzt werden.
    mspt: 38.0
    cpu: 70.0
    entities: 2000

  simulation-distance:
    # Priorität (höher = wichtiger).
    priority: 30
    # Abklingzeit zwischen erneuten Änderungen.
    cooldown-seconds: 120
    # Zielwert für die Simulationsdistanz während einer Aktion.
    target: 5
    min: 4
    max: 10

  entity-activation-range:
    # Priorität (höher = wichtiger).
    priority: 20
    # Abklingzeit zwischen erneuten Änderungen.
    cooldown-seconds: 180
    # Zielwert für die Entity-Activation-Range.
    target: 16

  mob-caps:
    # Priorität (höher = wichtiger).
    priority: 10
    # Abklingzeit zwischen erneuten Änderungen.
    cooldown-seconds: 180
    # Zielwerte pro Spawn-Kategorie.
    limits:
      monster: 35
      animal: 10
      ambient: 5
      water-animal: 5
